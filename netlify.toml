[build]
  command = "npm run build"
  publish = "dist"
  edge_functions = "netlify/edge-functions"

[dev]
  framework = "#static"

# Edge Function: OGP injection for SNS crawlers on blog pages
[[edge_functions]]
  function = "ogp"
  path = "/blog"

[[edge_functions]]
  function = "ogp"
  path = "/blog/*"

[[redirects]]
  from = "/api/*"
  to = "https://furukawa-api-production.up.railway.app/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

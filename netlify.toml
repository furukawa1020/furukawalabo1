[build]
  command = "npm run build"
  publish = "dist"
  edge_functions = "netlify/edge-functions"

[dev]
  framework = "#static"

# Edge Function: SEO prerender for all search crawlers (Googlebot, Bingbot etc.)
# クローラーには全実績テキストを含む静的HTMLを返す
[[edge_functions]]
  function = "seo"
  path = "/*"

# Edge Function: OGP injection for SNS crawlers on blog pages (legacy, keep for OGP)
[[edge_functions]]
  function = "ogp"
  path = "/blog"

[[edge_functions]]
  function = "ogp"
  path = "/blog/*"

[[redirects]]
  from = "/api/*"
  to = "https://furukawa-api-production.up.railway.app/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
